name: build-ios-ipa

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (no codesign)
        run: |
          xcodebuild -project FuelApp.xcodeproj -scheme FuelApp -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO | tail -n 60

      - name: Package unsigned ipa
        run: |
          set -e
          APP="build/Build/Products/Release-iphoneos/FuelApp.app"
          ls -l "$APP"
          rm -rf Payload fuel-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/FuelApp.app
          zip -qr fuel-unsigned.ipa Payload
          ls -l fuel-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: fuel-unsigned-ipa
          path: fuel-unsigned.ipa
          retention-days: 30